<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ROYO Home</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0e1217;color:white}.wrap{max-width:420px;margin:auto;min-height:100vh;background:#0e1217;padding-bottom:80px}.top{display:flex;justify-content:space-between;padding:14px;align-items:center}.logo{color:#22d3ee;font-weight:900;font-size:20px}.search{margin:10px 14px;background:#1d2632;padding:10px 12px;border-radius:12px;display:flex;gap:8px}.search input{background:transparent;border:none;outline:none;color:white;width:100%}.card{background:#1a2330;margin:12px 14px;border-radius:16px;overflow:hidden}.card img{width:100%;height:150px;object-fit:cover}.tag{background:#22d3ee;color:black;font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;position:absolute;margin:8px}.info{padding:10px}.price{color:#22d3ee;font-weight:800}.bottom{position:fixed;bottom:0;width:100%;max-width:420px;background:#171d26;display:flex;justify-content:space-around;padding:10px 0;border-radius:18px 18px 0 0}</style></head><body><div class="wrap"><div class="top"><div class="logo">🏠 ROYO</div><div><span onclick="location.href='owner.html'" style="background:#22d3ee;color:black;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px">+ Post</span></div></div><div class="search">🔍<input id="s" oninput="render()" placeholder="Search location, property, locality"></div><h3 style="margin:12px 14px">Nearby Properties <span style="float:right;color:#22d3ee;font-size:12px">See all ></span></h3><div id="list"></div><div class="bottom"><span>🏠<br><small style="color:#22d3ee">Home</small></span><span>🔍<br><small>Search</small></span><span>⭐<br><small>Favorites</small></span><span>👤<br><small>Profile</small></span></div></div><script>
let defaults=[{type:'apartment',title:'2 BHK • Koramangala',loc:'1.2 km away • Furnished',price:'24000',detail:'2BHK on 5th floor',img:'https://images.unsplash.com/photo-1560448204-603b3fc33ddc?w=600'},{type:'independent house',title:'3 BHK Villa • HSR Layout',loc:'2.5 km away • Semi-furnished',price:'42000',detail:'Villa with parking',img:'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600'}];
function render(){let q=(document.getElementById('s').value||'').toLowerCase();let custom=JSON.parse(localStorage.getItem('royo_props')||'[]');let all=[...custom,...defaults];let h='';all.forEach((p,i)=>{if((p.title+p.loc).toLowerCase().includes(q)){h+=`<div class="card" onclick="view(${i})"><div style="position:relative"><span class="tag">${p.type.toUpperCase()}</span><img src="${p.img}"></div><div class="info"><b>${p.title}</b><br><small style="color:#9ca3af">${p.loc}</small><br><span class="price">₹${p.price} / month</span></div></div>`}});document.getElementById('list').innerHTML=h;}
function view(i){let custom=JSON.parse(localStorage.getItem('royo_props')||'[]');let all=[...custom,...defaults];localStorage.setItem('royo_view',JSON.stringify(all[i]));location.href='detail.html';}
render();
</script></body></html>
